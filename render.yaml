services:
  # ---------- Backend: FastAPI (Uvicorn) ----------
  - type: web
    name: dapphacommerce-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: prisma py fetch && prisma generate && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.9"
  # ---------- Frontend: Astro (SSR, adaptador Node) ----------
  - type: web
    name: dapphacommerce-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node ./dist/server/entry.mjs
    envVars:
      - key: PUBLIC_API_BASE_URL
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: PUBLIC_SUPABASE_URL
        sync: false
      - key: PUBLIC_SUPABASE_KEY
        sync: false
      - key: GEOGUARD_TOKEN
        sync: false
      - key: PUBLIC_STRIPE_KEY
        sync: false
      - key: HOST
        value: "0.0.0.0" # necesario para que el adaptador Node de Astro escuche en todas las interfaces (health check de Render)
      - key: PORT
        value: "10000" # tuvo que agregarse manualmente; el puerto free-tier por defecto de Render
      - key: NODE_VERSION
        value: "24.14.0"
